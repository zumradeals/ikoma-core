# Production IKOMA Accueil (lot L12). Distinct du docker-compose.yml de développement : aucun code monté, aucun outil de développement,
# base de données et PHP sur un réseau interne sans accès extérieur, une seule porte d'entrée (nginx).
# Utilisation : voir docs/DEPLOIEMENT.md. Lancé par deploy/prod/install.sh depuis le dossier d'installation (par défaut /opt/ikoma).
name: ikoma

x-journaux: &journaux
  driver: json-file
  options: {max-size: 10m, max-file: '5'}

x-durci: &durci
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging: *journaux

services:
  db:
    <<: *durci
    image: postgres:18.6-trixie
    command: [postgres, -c, log_error_verbosity=terse, -c, log_parameter_max_length_on_error=0, -c, log_connections=on, -c, ssl=off]
    environment:
      POSTGRES_DB: ikoma
      POSTGRES_USER: ikoma
      POSTGRES_PASSWORD_FILE: /run/secrets/db_owner
    secrets: [db_owner]
    volumes: [postgres:/var/lib/postgresql]
    networks: [interne]
    # Capacités strictement nécessaires au démarrage de PostgreSQL (il abandonne ensuite les droits de root pour l'utilisateur postgres).
    cap_add: [CHOWN, FOWNER, DAC_READ_SEARCH, SETUID, SETGID]
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ikoma -d ikoma']
      interval: 5s
      timeout: 3s
      retries: 30

  migrator:
    <<: *durci
    restart: 'no'
    image: ikoma-php:${IKOMA_VERSION:?version manquante}
    build: {context: ., dockerfile: docker/prod/Dockerfile, target: php}
    command: [sh, scripts/migrate-prod.sh]
    secrets: [db_owner, db_app, app_key]
    networks: [interne]
    read_only: true
    tmpfs: [/tmp, /var/www/html/bootstrap/cache]
    depends_on:
      db: {condition: service_healthy}
    mem_limit: 512m

  php:
    <<: *durci
    image: ikoma-php:${IKOMA_VERSION:?version manquante}
    environment:
      APP_URL: https://${IKOMA_DOMAIN:?domaine manquant}
    secrets: [app_key, db_app, install_token]
    volumes: [storage:/var/www/html/storage]
    networks: [interne]
    read_only: true
    tmpfs: [/tmp, /var/www/html/bootstrap/cache]
    depends_on:
      migrator: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, php, -r, '$$s=@fsockopen("127.0.0.1",9000);exit($$s?0:1);']
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 1g
    cpus: 2.0

  scheduler:
    <<: *durci
    image: ikoma-php:${IKOMA_VERSION:?version manquante}
    command: [php, artisan, schedule:work]
    environment:
      APP_URL: https://${IKOMA_DOMAIN:?domaine manquant}
    secrets: [app_key, db_app]
    volumes: [storage:/var/www/html/storage]
    networks: [interne]
    read_only: true
    tmpfs: [/tmp, /var/www/html/bootstrap/cache]
    depends_on:
      migrator: {condition: service_completed_successfully}
    mem_limit: 512m

  nginx:
    <<: *durci
    image: ikoma-nginx:${IKOMA_VERSION:?version manquante}
    build: {context: ., dockerfile: docker/prod/Dockerfile, target: nginx}
    # Les ports 80 et 443 de la machine arrivent sur les ports sans privilège du conteneur (8080 et 8443).
    ports: ['${IKOMA_HTTP_PORT:-80}:8080', '${IKOMA_HTTPS_PORT:-443}:8443']
    volumes:
      - ./prod-data/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./prod-data/tls:/etc/ikoma/tls:ro
      - ./prod-data/acme:/var/www/acme:ro
    networks: [interne, exterieur]
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      php: {condition: service_healthy}
    mem_limit: 256m

networks:
  # Sans accès à Internet : la base et PHP ne peuvent ni être joints ni joindre l'extérieur.
  interne: {internal: true}
  exterieur: {}

volumes:
  postgres:
  storage:

secrets:
  db_owner: {file: ./prod-data/secrets/db_owner}
  db_app: {file: ./prod-data/secrets/db_app}
  app_key: {file: ./prod-data/secrets/app_key}
  install_token: {file: ./prod-data/secrets/install_token}
