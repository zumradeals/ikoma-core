services:
  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: ${DB_DATABASE:-ikoma}
      POSTGRES_USER: ${DB_USERNAME:-ikoma}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-installation-only}
    volumes:
      - postgres:/var/lib/postgresql
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/01-test.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 30
  php:
    build: ./docker/php
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    command: [sh, -c, 'composer install --no-interaction --prefer-dist && php artisan migrate --force && chmod -R a+rwX storage bootstrap/cache && php-fpm']
    healthcheck:
      test: [CMD, php, -r, 'exit(is_file("vendor/autoload.php") ? 0 : 1);']
      interval: 5s
      retries: 60
  front:
    image: node:24-bookworm
    working_dir: /app
    volumes:
      - .:/app
    command: [sh, -c, 'npm ci && npm run build']
  nginx:
    image: nginx:1.30.6-bookworm
    ports: ['127.0.0.1:8080:80']
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php:
        condition: service_healthy
      front:
        condition: service_completed_successfully
  e2e:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    profiles: [tools]
    network_mode: service:nginx
    working_dir: /app
    volumes:
      - .:/app
    environment:
      BASE_URL: http://localhost
    command: [sh, -c, 'npx playwright install chromium && npm run e2e']
volumes:
  postgres:
