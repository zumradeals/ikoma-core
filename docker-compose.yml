services:
  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: ikoma
      POSTGRES_USER: ikoma
      POSTGRES_PASSWORD_FILE: /run/secrets/db-owner
    volumes:
      - postgres:/var/lib/postgresql
      - ./.secrets/db-owner:/run/secrets/db-owner:ro
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/01-test.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ikoma -d ikoma']
      interval: 3s
      timeout: 3s
      retries: 30
  migrator:
    build: ./docker/php
    working_dir: /var/www/html
    volumes: ['.:/var/www/html']
    depends_on:
      db:
        condition: service_healthy
    command: [sh, scripts/migrate.sh]
  php:
    build: ./docker/php
    working_dir: /var/www/html
    volumes: ['.:/var/www/html']
    depends_on:
      migrator:
        condition: service_completed_successfully
    command: [php-fpm]
    healthcheck:
      test: [CMD, php, -r, '$$s=@fsockopen("127.0.0.1",9000);exit($$s?0:1);']
      interval: 3s
      retries: 30
  front:
    image: node:24-bookworm
    working_dir: /app
    volumes: ['.:/app']
    command: [sh, -c, 'npm ci && npm run build']
  nginx:
    image: nginx:stable-alpine-slim@sha256:dede8895648b461178c3bc604f7eed4423efe5220b2c4d839f5eb3d34ac3f8f7
    ports: ['127.0.0.1:8080:80']
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php:
        condition: service_healthy
      front:
        condition: service_completed_successfully
  e2e:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    profiles: [tools]
    network_mode: service:nginx
    working_dir: /app
    volumes: ['.:/app']
    environment:
      BASE_URL: http://localhost
    command: [sh, -c, 'npx playwright install chromium && npm run e2e']
volumes:
  postgres:
