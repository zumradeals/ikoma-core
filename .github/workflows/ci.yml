name: Fondations L0
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make install
      - run: make up
      - run: make lint
      - run: make test
      - run: make test-front
      - run: make e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-l1
          path: test-results/
          if-no-files-found: ignore
      - if: failure()
        run: docker compose logs
      - if: always()
        run: make down
