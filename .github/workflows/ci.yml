name: Fondations L0
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  packages: read
jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Authentifier la lecture du candidat GHCR par digest exact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin > /dev/null
      - run: make install
      - run: make up
      - run: make lint
      - name: Vérifier la reconstruction et le seed en moins de deux minutes
        run: |
          umask 077
          start=$(date +%s)
          if ! make migrate-fresh-seed > /tmp/ikoma-seed-prive.log 2>&1; then
            sed '/mot de passe affiché une seule fois/d' /tmp/ikoma-seed-prive.log
            exit 1
          fi
          elapsed=$(( $(date +%s) - start ))
          echo "Reconstruction et seed : ${elapsed} secondes"
          test "$elapsed" -lt 120
      - run: make test
      - name: Vérifier la répétabilité des tests PHP
        run: make test
      - name: Tests frontend
        if: ${{ !cancelled() }}
        run: make test-front
      - name: Tests E2E (sonde de bissection : exécutés même si les tests PHP échouent)
        if: ${{ !cancelled() }}
        run: make e2e
      - name: Recette et captures Agent V2 sur données fictives isolées
        if: ${{ !cancelled() }}
        run: make e2e-agent
      - name: Vérifier le contrôle des exceptions de sécurité
        run: python3 -m unittest discover -s tests/security
      - name: Auditer les dépendances applicatives (blocage élevé et critique)
        if: ${{ !cancelled() }}
        run: |
          mkdir -p security-results
          set +e
          docker compose exec -T php composer audit --locked --format=json --ignore-severity=low --ignore-severity=medium > security-results/composer.json
          composer_result=$?
          docker compose run --rm --no-deps front npm audit --audit-level=high --json > security-results/npm.json
          npm_result=$?
          test "$composer_result" -eq 0 && test "$npm_result" -eq 0
      - name: Installer les outils d’analyse vérifiés
        if: ${{ !cancelled() }}
        run: sh scripts/security/install-tools.sh
      - name: Rechercher les secrets dans tout l’historique Git
        if: ${{ !cancelled() }}
        run: /tmp/ikoma-security-tools/gitleaks git . --redact=100 --report-format=json --report-path=security-results/secrets.json
      - name: Analyser les images de développement (blocage élevé et critique)
        if: ${{ !cancelled() }}
        run: |
          result=0
          for service in php nginx db; do
            image=$(docker inspect --format '{{.Image}}' "$(docker compose ps -q "$service")")
            /tmp/ikoma-security-tools/trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output "security-results/image-$service.json" "$image" || result=1
          done
          exit "$result"
      - name: Résumé des failles trouvées par Trivy (élevées et critiques)
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY'
          import glob, json
          for path in sorted(glob.glob('security-results/image-*.json')):
              data = json.load(open(path))
              found = [(v.get('Severity'), v.get('VulnerabilityID'), v.get('PkgName'), v.get('InstalledVersion'), v.get('FixedVersion', '')) for r in data.get('Results', []) for v in (r.get('Vulnerabilities') or [])]
              print(path, len(found), 'faille(s) élevée(s) ou critique(s)')
              for item in found[:40]:
                  print('  ', *item)
          PY
      - name: OWASP ZAP baseline sur l’application de test
        if: ${{ !cancelled() }}
        run: |
          chmod 777 security-results
          set +e
          docker run --rm --network "container:$(docker compose ps -q nginx)" -v "$PWD/security-results:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:2.17.0 zap-baseline.py -t http://localhost -m 1 -T 5 -J zap.json -r zap.html
          result=$?
          set -e
          test "$result" -lt 3
          python3 scripts/security/zap-gate.py security-results/zap.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analyses-securite
          path: security-results/
          if-no-files-found: ignore
      - name: Retirer les secrets de recette des instantanés textuels
        if: always()
        run: |
          sudo chown -R "$(id -u):$(id -g)" test-results security-results 2>/dev/null || true
          python3 scripts/security/redact-test-artifacts.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-l3
          path: test-results/
          if-no-files-found: ignore
      - if: failure()
        run: docker compose logs --tail=60
      - if: always()
        run: make down

  # Production (lot L12) : installation complète depuis zéro avec le seul script install.sh, puis recette automatique
  # (assistant d'initialisation à usage unique, vérifications de sécurité, refus des données de démonstration,
  # sauvegarde chiffrée puis restauration avec audit:verify et effectifs identiques, retour arrière).
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Authentifier la lecture du candidat GHCR par digest exact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin > /dev/null
      - name: Vérifier les contrats de refus du contrôle des images finales
        run: python3 -m unittest discover -s tests/security
      - name: Clé de sauvegarde de test (la clé privée n'est jamais donnée au serveur de recette)
        run: |
          export GNUPGHOME="$(mktemp -d)"
          gpg --batch --passphrase '' --quick-generate-key 'Sauvegarde fictive <sauvegarde@exemple.test>' rsa3072 encrypt never
          gpg --armor --export > "$RUNNER_TEMP/cle-publique.asc"
          gpg --batch --pinentry-mode loopback --passphrase '' --armor --export-secret-keys > "$RUNNER_TEMP/cle-privee.asc"
      - name: Installation de production depuis zéro (install.sh seul)
        run: bash deploy/prod/install.sh --domaine localhost --tls autosigne --cle-sauvegarde "$RUNNER_TEMP/cle-publique.asc" --ports 8080:8443 --sans-planification
      - name: Recette de production
        run: bash deploy/prod/ci-recette.sh "$RUNNER_TEMP/cle-privee.asc"
      - name: R06 — Vérifier la surface de paquets PHP dans l'image finale
        run: |
          set -euo pipefail
          mkdir -p security-r06
          image=$(docker inspect --format '{{.Image}}' "$(docker compose --env-file prod-data/env -f docker-compose.prod.yml ps -q php)")
          docker run --rm -i --network none --read-only --entrypoint sh "$image" -s < scripts/security/r06-runtime-verify.sh | tee security-r06/verification.txt
          docker run --rm -i --network none --read-only --entrypoint sh "$image" -s < scripts/security/r06-package-inventory.sh | LC_ALL=C sort > security-r06/paquets-php-final.txt
          grep -Eq '^[^#[:space:]]' security-r06/paquets-php-final.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r06-paquets-runtime
          path: security-r06/
          if-no-files-found: error
      - name: R05 — Vérifier la version et le comportement MIME dans l'image finale
        run: |
          mkdir -p security-r05
          image=$(docker inspect --format '{{.Image}}' "$(docker compose --env-file prod-data/env -f docker-compose.prod.yml ps -q php)")
          docker run --rm --network none --read-only -v "$PWD/scripts/security/mime-runtime-probe.php:/probe.php:ro" --entrypoint php "$image" /probe.php "$image" > security-r05/mime-runtime.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r05-runtime
          path: security-r05/
          if-no-files-found: error
      - name: Installer les outils d’analyse vérifiés
        if: ${{ !cancelled() }}
        run: sh scripts/security/install-tools.sh
      - name: Analyser les trois images finales (blocage élevé et critique)
        if: ${{ !cancelled() }}
        run: python3 scripts/security/final-images.py scan --output security-production
      - name: Refuser une preuve finale manquante ou incohérente
        if: ${{ !cancelled() }}
        run: python3 scripts/security/final-images.py verify --output security-production
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analyses-images-finales
          path: security-production/
          if-no-files-found: error
          retention-days: 90
      - if: failure()
        run: docker compose --project-directory "$PWD" --env-file prod-data/env -f docker-compose.prod.yml logs --tail=80
      - if: always()
        run: docker compose --project-directory "$PWD" --env-file prod-data/env -f docker-compose.prod.yml down -v || true
