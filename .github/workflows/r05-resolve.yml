name: R05 — Résolution Composer ciblée (préparation)
on: pull_request
permissions:
  contents: read
jobs:
  resolution:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Résoudre Mime avec le runtime et Composer déjà utilisés par le projet
        run: |
          docker compose build php
          docker compose run --rm --no-deps php composer update symfony/mime:7.4.22 --no-install --no-scripts --no-interaction
          docker compose run --rm --no-deps php composer validate --strict --no-check-publish
          sha256sum composer.lock > composer-lock.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: r05-resolution-composer
          path: |
            composer.lock
            composer-lock.sha256
          if-no-files-found: error
