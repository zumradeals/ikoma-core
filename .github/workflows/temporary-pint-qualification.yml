name: Temporary PHP style format verification

on:
  pull_request:
    paths:
      - '.github/workflows/temporary-pint-qualification.yml'
      - 'scripts/security/verify-integrated-php.php'

permissions:
  contents: read

jobs:
  pint-proposal:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger Pint exact du lock et vérifier sa signature d'archive SHA-256
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/laravel/pint/releases/download/v1.32.1/pint.phar -o /tmp/ikoma-pint.phar
          echo '8af85d94c4b6ada1d90099ff1f2bc32e2c88538649473236719c519c69e34e5f  /tmp/ikoma-pint.phar' | sha256sum -c -
          php /tmp/ikoma-pint.phar --version
      - name: Appliquer formatage sur copie CI uniquement (aucune écriture dans la branche)
        run: |
          set -euo pipefail
          php /tmp/ikoma-pint.phar scripts/security/verify-integrated-php.php
          php -l scripts/security/verify-integrated-php.php
      - uses: actions/upload-artifact@v4
        with:
          name: temporary-pint-formatted-file
          path: scripts/security/verify-integrated-php.php
          if-no-files-found: error
          retention-days: 3
